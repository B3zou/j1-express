# ─────────────────────────────────────────────────────────────────────────────
# GG League · J1 — environnement de la journée (Docker Compose v2)
# Ne lancez pas ces commandes à la main : utilisez le Makefile (make help).
#
#   api       Node.js 22 + Express 5 (votre API, en TypeScript)   http://localhost:8000
#   database  PostgreSQL 17                                       localhost:5433 (depuis votre poste)
#   api-test  copie de l'API sur la base « app_test », pour make test
#   hurl      l'outil qui exécute les tests, lancé à la demande
# ─────────────────────────────────────────────────────────────────────────────
name: gg-league-j1

x-api: &api
  build:
    context: ./api
  image: ${API_IMAGE:-gg-league-j1-api:dev}
  # Le conteneur tourne avec VOTRE identifiant : les fichiers qu'il crée (node_modules…) vous appartiennent.
  user: "${UID:-1000}:${GID:-1000}"
  depends_on:
    database:
      condition: service_healthy
  volumes:
    - ./api:/app
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
    interval: 3s
    timeout: 5s
    retries: 60
    start_period: 20s

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - database_data:/var/lib/postgresql/data
    ports:
      # Accès depuis votre poste (DBeaver, DataGrip...) : localhost:5433, utilisateur app / mot de passe app
      - "${DB_PORT:-5433}:5432"

  api:
    <<: *api
    environment:
      PORT: 3000
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: postgres://app:app@database:5432/app
    ports:
      - "${API_PORT:-8000}:3000"
    tty: true

  api-test:
    <<: *api
    profiles: ["test"]
    command: ["npm", "run", "start"]
    environment:
      PORT: 3000
      INSTALL_DEPS: "0"
      DATABASE_URL: postgres://app:app@database:5432/app_test
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_healthy

  hurl:
    image: ghcr.io/orange-opensource/hurl:8.0.1
    profiles: ["tools"]
    working_dir: /tests
    volumes:
      - ./tests:/tests:ro
      - ./reports:/reports

volumes:
  database_data:
